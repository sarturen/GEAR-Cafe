api: gear.dsl/v1
name: verify-board-observe
description: 四类资源同时观察，再各发一条命令。串口与相机需已连接；验证模式默认预连接。
body:
  - assert:
      all:
        - resource: ADB.main
          condition: STATE_IS
          args: {state: device}
        - {resource: CONSOLE.mcu, condition: CONNECTED}
        - {resource: CONSOLE.soc, condition: CONNECTED}
        - {resource: SCREEN.center, condition: STREAMING}
      within: 3s
      every: 200ms

  - do:
      resource: ADB.main
      operation: SHELL
      args: {command: "echo GEAR_VERIFY"}
  - assert:
      all:
        - resource: ADB.main
          condition: OUTPUT_CONTAINS
          args: {command: "echo GEAR_VERIFY", text: GEAR_VERIFY}

  - do:
      resource: CONSOLE.mcu
      operation: SEND
      args: {command: "status"}
  - assert:
      all:
        - resource: CONSOLE.mcu
          condition: OUTPUT_CONTAINS
          args: {text: status}
      within: 2s
      every: 100ms

teardown:
  - do: {resource: POWER.kl15, operation: OFF}
  - do: {resource: POWER.kl30, operation: OFF}

evidence_on_fail:
  - {resource: ADB.main, evidence: DIAGNOSTIC_LOGS}
  - {resource: CONSOLE.mcu, evidence: TRANSCRIPT}
  - {resource: SCREEN.center, evidence: SNAPSHOT}
